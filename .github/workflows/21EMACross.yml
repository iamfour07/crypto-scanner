name: Hourly Scanner

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}   # own lock: never overlaps itself, never cancels other scanners
  cancel-in-progress: false

permissions:
  contents: write # required for pushing changes

jobs:
  run-scanner:
    runs-on: ubuntu-latest
    timeout-minutes: 20      # both scanners run in this one job
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: main          # latest main at run time, not the commit at trigger time
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests

      # Both scanners run one after the other in the SAME job, so their JSON files
      # are committed and pushed together — they can never race each other.
      # continue-on-error: if one scanner crashes, the other still runs and its
      # JSON is still committed.
      - name: Run 1H EMA 9 Scanner (EMARsiSwing.py)
        id: ema
        continue-on-error: true
        run: python EMARsiSwing.py
        env:
          TELEGRAM_BOT_TOKEN_21_EMA: ${{ secrets.TELEGRAM_BOT_TOKEN_21_EMA }}
          TELEGRAM_CHAT_ID_21_EMA: ${{ secrets.TELEGRAM_CHAT_ID_21_EMA }}

      - name: Run Daily BB Reversal Scanner (ReversalSell.py)
        id: reversal
        continue-on-error: true
        run: python ReversalSell.py
        env:
          TELEGRAM_BOT_TOKEN_21_EMA: ${{ secrets.TELEGRAM_BOT_TOKEN_21_EMA }}
          TELEGRAM_CHAT_ID_21_EMA: ${{ secrets.TELEGRAM_CHAT_ID_21_EMA }}

      - name: Commit Watchlist Updates
        if: always()
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          # Sirf zaroori files add karein
          if [ -f ReversalWatchlist.json ]; then git add ReversalWatchlist.json; fi
          if [ -f reversal.json ]; then git add reversal.json; fi

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Update EMA + reversal watchlists [skip ci]"

          # Kisi bhi extra temporary file change ko discard karein
          git checkout -- . || true

          # Doosra scanner same time push kare toh retry (alag files, conflict nahi hoga)
          for i in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin main; then
              echo "Pushed on attempt $i"
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            echo "Push failed (attempt $i) — retrying"
            sleep $((i * 5))
          done
          echo "Push failed after 5 attempts"
          exit 1

      # Show the run as failed (red) if either scanner crashed, after the commit is done
      - name: Report scanner failures
        if: steps.ema.outcome == 'failure' || steps.reversal.outcome == 'failure'
        run: |
          echo "EMARsiSwing.py: ${{ steps.ema.outcome }}"
          echo "ReversalSell.py: ${{ steps.reversal.outcome }}"
          exit 1
