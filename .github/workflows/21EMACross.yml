name: Hourly Scanner

on:
  workflow_dispatch:

concurrency:
  group: scanner-lock
  cancel-in-progress: false

permissions:
  contents: write # required for pushing changes

jobs:
  run-scanner:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests

      - name: Run Scanner
        run: python EMARsiSwing.py
        env:
          TELEGRAM_BOT_TOKEN_21_EMA: ${{ secrets.TELEGRAM_BOT_TOKEN_21_EMA }}
          TELEGRAM_CHAT_ID_21_EMA: ${{ secrets.TELEGRAM_CHAT_ID_21_EMA }}

      - name: Commit Watchlist Updates
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"

          for file in ReversalWatchlist.json; do
            if [ -f "$file" ]; then
              git add "$file"
            fi
          done

          if ! git diff --cached --quiet; then
            git commit -m "Update EMA watchlists [skip ci]"
            git push origin main
          else
            echo "No watchlist changes to commit"
          fi
