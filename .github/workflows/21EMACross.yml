name: Hourly Scanner

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}   # own lock: never overlaps itself, never cancels other scanners
  cancel-in-progress: false

permissions:
  contents: write # required for pushing changes

jobs:
  run-scanner:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: main          # latest main at run time, not the commit at trigger time
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests

      - name: Run Scanner
        run: python EMARsiSwing.py
        env:
          TELEGRAM_BOT_TOKEN_21_EMA: ${{ secrets.TELEGRAM_BOT_TOKEN_21_EMA }}
          TELEGRAM_CHAT_ID_21_EMA: ${{ secrets.TELEGRAM_CHAT_ID_21_EMA }}

      - name: Commit Watchlist Updates
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          # Sirf zaroori files add karein
          if [ -f ReversalWatchlist.json ]; then git add ReversalWatchlist.json; fi

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Update EMA watchlists [skip ci]"

          # Kisi bhi extra temporary file change ko discard karein
          git checkout -- . || true

          # Doosra scanner same time push kare toh retry (alag files, conflict nahi hoga)
          for i in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin main; then
              echo "Pushed on attempt $i"
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            echo "Push failed (attempt $i) — retrying"
            sleep $((i * 5))
          done
          echo "Push failed after 5 attempts"
          exit 1
